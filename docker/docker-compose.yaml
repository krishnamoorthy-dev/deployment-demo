version: '3.8'
services:
  app-instance-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployment-demo-app-1
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
    restart: unless-stopped

  app-instance-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployment-demo-app-2
    ports:
      - "8082:8080"
    environment:
      - SERVER_PORT=8080
    restart: unless-stopped
